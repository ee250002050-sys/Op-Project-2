<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e5edf7}#wrap{width:100%;box-sizing:border-box;border:1px solid #263449;border-radius:12px;overflow:hidden;background:#101a2b}#toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap;background:#142238;border-bottom:1px solid #263449}button{border:1px solid #40536d;border-radius:8px;padding:7px 12px;color:#dce8f7;background:#1b2b43;cursor:pointer;font-weight:600}button.active{background:#0f766e;border-color:#2dd4bf;color:white}#hint{margin-left:auto;font-size:12px;color:#a9bad0}canvas{display:block;width:100%;background:radial-gradient(circle at 50% 45%,#17283e,#0c1524 75%);cursor:grab;touch-action:none}canvas.dragging{cursor:grabbing}
</style></head><body><div id="wrap"><div id="toolbar"><button id="move" class="active">Move</button><button id="add">Add link</button><button id="remove">Remove link</button><button id="zoomout">−</button><button id="zoomin">+</button><button id="fit">Fit view</button><span id="hint">Drag nodes to move · drag empty space or scroll to pan · Ctrl/⌘ + scroll to zoom</span></div><canvas id="graph"></canvas></div><script>
(()=>{const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),hint=document.getElementById('hint');const buttons={move:document.getElementById('move'),add:document.getElementById('add'),remove:document.getElementById('remove')};let args={nodes:[],edges:[],area_size:100,height:590},nodes=[],edges=[],mode='move',selected=null,dragging=null,panning=false,panStart=null,panX=0,panY=0,zoom=1,lastSent='';const pad=38,radius=15;
function setMode(m){mode=m;Object.entries(buttons).forEach(([k,b])=>b.classList.toggle('active',k===m));hint.textContent=m==='move'?'Drag a node to move it':m==='add'?'Click two nodes to create a link':'Click a link to remove it';draw()}Object.keys(buttons).forEach(k=>buttons[k].addEventListener('click',()=>setMode(k)));
function dims(){const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1,w=Math.max(320,r.width),h=Math.max(420,args.height||590);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);return{w,h}}
function xy(n,w,h){const a=Math.max(1,Number(args.area_size)||100),bx=pad+n.x/a*(w-2*pad),by=h-pad-n.y/a*(h-2*pad);return{x:w/2+(bx-w/2)*zoom+panX,y:h/2+(by-h/2)*zoom+panY}}function modelPoint(x,y,w,h){const a=Math.max(1,Number(args.area_size)||100),bx=(x-panX-w/2)/zoom+w/2,by=(y-panY-h/2)/zoom+h/2;return{x:Math.max(0,Math.min(a,(bx-pad)/(w-2*pad)*a)),y:Math.max(0,Math.min(a,(1-(by-pad)/(h-2*pad))*a))}}
function key(a,b){return a<b?`${a},${b}`:`${b},${a}`}function hasEdge(a,b){return edges.some(e=>key(e[0],e[1])===key(a,b))}
function draw(){const{w,h}=dims();ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(148,163,184,.10)';ctx.lineWidth=1;for(let i=0;i<=10;i++){let x=pad+(w-2*pad)*i/10,y=pad+(h-2*pad)*i/10;ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,h-pad);ctx.stroke();ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}const lookup=new Map(nodes.map(n=>[n.id,n]));edges.forEach(e=>{const a=lookup.get(e[0]),b=lookup.get(e[1]);if(!a||!b)return;const p=xy(a,w,h),q=xy(b,w,h);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle='rgba(148,163,184,.62)';ctx.lineWidth=2;ctx.stroke()});nodes.forEach(n=>{const p=xy(n,w,h),sink=!!n.is_sink,source=!!n.is_source,sel=n.id===selected;ctx.beginPath();if(sink){ctx.moveTo(p.x,p.y-radius-3);ctx.lineTo(p.x+radius+3,p.y);ctx.lineTo(p.x,p.y+radius+3);ctx.lineTo(p.x-radius-3,p.y);ctx.closePath()}else if(source){for(let k=0;k<6;k++){const a=Math.PI/3*k-Math.PI/6;const x=p.x+Math.cos(a)*(radius+3),y=p.y+Math.sin(a)*(radius+3);if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath()}else ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fillStyle=sink?'#8b5cf6':source?'#ea580c':sel?'#0d9488':'#2563eb';ctx.fill();ctx.lineWidth=sel?3:1.5;ctx.strokeStyle=sel?'#99f6e4':'#cbd5e1';ctx.stroke();ctx.fillStyle='#f8fafc';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sink?'K':source?'SRC':String(n.id),p.x,p.y);ctx.fillStyle='#b8c7d9';ctx.font='10px system-ui';ctx.fillText(sink?'SINK':source?'SOURCE':`Sensor ${n.id}`,p.x,p.y+radius+12)});ctx.fillStyle='#93a4ba';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText(`Nodes: ${nodes.length} · Links: ${edges.length}`,12,h-12)}
function nearestNode(x,y,w,h){let best=null,bd=1e9;nodes.forEach(n=>{const p=xy(n,w,h),d=Math.hypot(x-p.x,y-p.y);if(d<radius+8&&d<bd){best=n;bd=d}});return best}function nearestEdge(x,y,w,h){let best=null,bd=1e9;edges.forEach(e=>{const a=nodes.find(n=>n.id===e[0]),b=nodes.find(n=>n.id===e[1]);if(!a||!b)return;const p=xy(a,w,h),q=xy(b,w,h),dx=q.x-p.x,dy=q.y-p.y,t=Math.max(0,Math.min(1,((x-p.x)*dx+(y-p.y)*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(x-(p.x+t*dx),y-(p.y+t*dy));if(d<10&&d<bd){best=e;bd=d}});return best}
function send(){const value={positions:nodes.map(n=>({id:n.id,x:n.x,y:n.y})),edges:edges.map(e=>[...e]),selected_node:selected},sig=JSON.stringify(value);if(sig===lastSent)return;lastSent=sig;window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value},'*')}
function pointer(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
function zoomAt(factor,x,y){const old=zoom;zoom=Math.max(.35,Math.min(3.5,zoom*factor));panX=x-(x-panX-canvas.clientWidth/2)/old*zoom-canvas.clientWidth/2;panY=y-(y-panY-canvas.clientHeight/2)/old*zoom-canvas.clientHeight/2;draw()}
document.getElementById('zoomin').addEventListener('click',()=>zoomAt(1.2,canvas.clientWidth/2,canvas.clientHeight/2));document.getElementById('zoomout').addEventListener('click',()=>zoomAt(1/1.2,canvas.clientWidth/2,canvas.clientHeight/2));document.getElementById('fit').addEventListener('click',()=>{zoom=1;panX=0;panY=0;draw()});
canvas.addEventListener('wheel',ev=>{ev.preventDefault();if(ev.ctrlKey||ev.metaKey){const p=pointer(ev);zoomAt(ev.deltaY<0?1.12:1/1.12,p.x,p.y)}else{panX-=ev.deltaX;panY-=ev.deltaY;draw()}},{passive:false});
canvas.addEventListener('pointerdown',ev=>{const{w,h}=dims(),p=pointer(ev),n=nearestNode(p.x,p.y,w,h);canvas.setPointerCapture(ev.pointerId);if(mode==='move'){if(n){selected=n.id;dragging=n;canvas.classList.add('dragging')}else{panning=true;panStart={x:p.x,y:p.y,panX,panY};canvas.classList.add('dragging')}draw()}else if(mode==='add'){if(n){if(selected===null){selected=n.id;hint.textContent=`First endpoint: ${n.id}. Click another node.`}else if(selected!==n.id){if(!hasEdge(selected,n.id))edges.push([selected,n.id]);selected=null;hint.textContent='Link created. Click two nodes to add another.';send()}else selected=null;draw()}}else if(mode==='remove'){const e=nearestEdge(p.x,p.y,w,h);if(e){edges=edges.filter(x=>key(x[0],x[1])!==key(e[0],e[1]));hint.textContent=`Removed link ${e[0]}–${e[1]}`;send();draw()}}});
canvas.addEventListener('pointermove',ev=>{const p=pointer(ev);if(dragging){const{w,h}=dims(),m=modelPoint(p.x,p.y,w,h);dragging.x=m.x;dragging.y=m.y;draw()}else if(panning&&panStart){panX=panStart.panX+(p.x-panStart.x);panY=panStart.panY+(p.y-panStart.y);draw()}});function endDrag(){let movedNode=!!dragging;dragging=null;panning=false;panStart=null;canvas.classList.remove('dragging');if(movedNode)send()}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
function render(a){args=a||args;nodes=(Array.isArray(args.nodes)?args.nodes:[]).map(n=>({id:Number(n.id),x:Number(n.x),y:Number(n.y),is_sink:!!n.is_sink,is_source:!!n.is_source}));edges=(Array.isArray(args.edges)?args.edges:[]).map(e=>[Number(e[0]),Number(e[1])]);if(selected!==null&&!nodes.some(n=>n.id===selected))selected=null;if(selected===null&&nodes.length)selected=nodes[0].id;draw()}window.addEventListener('message',ev=>{const m=ev.data||{};if(m.type==='streamlit:render'&&m.args)render(m.args)});window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:args.height||590},'*')})();
</script></body></html>
